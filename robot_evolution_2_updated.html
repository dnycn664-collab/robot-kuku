<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロボットエボリューション２</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #eaf7ff, #fff8e8);
    color: #17324d;
    min-height: 100vh;
  }
  .wrap {
    width: min(960px, 94vw);
    margin: 0 auto;
    padding: 22px 0 36px;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(28px, 5vw, 46px);
    letter-spacing: .04em;
  }
  .subtitle {
    text-align: center;
    margin: 8px 0 18px;
    font-size: clamp(19px, 3vw, 28px);
    font-weight: 800;
  }
  .robot-card {
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(35,75,105,.15);
    text-align: center;
    margin-bottom: 18px;
  }
  .robot {
    height: 250px;
    max-width: 100%;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .form-label {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 900;
  }
  .mission {
    margin: 16px auto;
    background: #fff;
    border: 3px solid #4b9fe8;
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 6px 18px rgba(35,75,105,.10);
  }
  .mission-title {
    text-align: center;
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 14px;
  }
  .rows {
    display: grid;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  .row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: clamp(22px, 4vw, 31px);
    font-weight: 900;
    flex-wrap: wrap;
  }
  input {
    width: 82px;
    height: 56px;
    border: 3px solid #79aee0;
    border-radius: 13px;
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    background: #f9fdff;
    color: #17324d;
  }
  input:focus {
    outline: none;
    border-color: #ff9f43;
    box-shadow: 0 0 0 4px rgba(255,159,67,.18);
  }
  .small-note {
    text-align: center;
    font-size: 16px;
    margin: 12px 0 0;
    color: #49657c;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 15px;
    padding: 13px 24px;
    font-size: 21px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  #checkBtn { background: #ffbd45; color: #5a3700; }
  #resetBtn { background: #dceaf6; color: #24445d; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .message {
    min-height: 54px;
    margin-top: 14px;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
  }
  .progress {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    margin-top: 4px;
  }
  .hidden { display: none; }
  .complete {
    text-align: center;
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 8px 24px rgba(35,75,105,.15);
  }
  .complete h2 {
    margin: 0 0 8px;
    font-size: clamp(27px, 5vw, 42px);
  }
  .complete p {
    font-size: 21px;
    font-weight: 800;
  }
  @media (max-width: 560px) {
    .robot { height: 210px; }
    input { width: 68px; height: 52px; font-size: 25px; }
    .row { gap: 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ロボットエボリューション２</h1>
  <div class="subtitle">ロボットを進化させよう</div>

  <section class="robot-card">
    <img id="robot" class="robot" alt="ロボット">
    <div id="formLabel" class="form-label">エネルギー切れ</div>
    <div class="progress">進化 <span id="count">0</span> / 3</div>
  </section>

  <section id="mission" class="mission">
    <div class="mission-title">「□が□こで□」を3つつくろう！</div>
    <div class="rows">
      <div class="row">
        <input id="a1" type="number" min="1" max="9" inputmode="numeric" aria-label="1問目の1つ分の数">
        <span>が</span>
        <input id="b1" type="number" min="1" max="9" inputmode="numeric" aria-label="1問目の個数">
        <span>こで</span>
        <input id="c1" type="number" min="1" max="81" inputmode="numeric" aria-label="1問目の答え">
      </div>
      <div class="row">
        <input id="a2" type="number" min="1" max="9" inputmode="numeric" aria-label="2問目の1つ分の数">
        <span>が</span>
        <input id="b2" type="number" min="1" max="9" inputmode="numeric" aria-label="2問目の個数">
        <span>こで</span>
        <input id="c2" type="number" min="1" max="81" inputmode="numeric" aria-label="2問目の答え">
      </div>
      <div class="row">
        <input id="a3" type="number" min="1" max="9" inputmode="numeric" aria-label="3問目の1つ分の数">
        <span>が</span>
        <input id="b3" type="number" min="1" max="9" inputmode="numeric" aria-label="3問目の個数">
        <span>こで</span>
        <input id="c3" type="number" min="1" max="81" inputmode="numeric" aria-label="3問目の答え">
      </div>
    </div>
    <div class="small-note">3つの答えをたして、合計20にしよう！</div>
    <div class="buttons">
      <button id="checkBtn" onclick="checkMission()">エネルギーをおくる！</button>
      <button id="resetBtn" onclick="resetMission()">やりなおす</button>
    </div>
    <div id="message" class="message"></div>
  </section>

  <section id="complete" class="complete hidden">
    <h2>🏆 最終メガしんか、かんせい！</h2>
    <p>ロボットにたっぷりエネルギーがとどいたよ！</p>
    <button id="againBtn" onclick="resetAll()">もう一度あそぶ</button>
  </section>
</div>

};

const labels = [
  "エネルギー切れ",
  "エネルギーをおくってメガしんかだ！",
  "もっともっとエネルギーを！！",
  "おめでとう！さいしゅうメガしんか、かんせいだ！！"
];

let successCount = 0;

function setRobot() {
  const robot = document.getElementById("robot");
  const label = document.getElementById("formLabel");
  const srcs = [imgs.start, imgs.form1, imgs.form2, imgs.form3];
  robot.src = srcs[successCount];
  label.textContent = labels[successCount];
  document.getElementById("count").textContent = successCount;
}

function values() {
  const rows = [1,2,3].map(i => ({
    a: Number(document.getElementById("a"+i).value),
    b: Number(document.getElementById("b"+i).value),
    c: Number(document.getElementById("c"+i).value)
  }));
  return rows;
}

function checkMission() {
  const rows = values();
  const msg = document.getElementById("message");

  if (rows.some(r => !Number.isInteger(r.a) || !Number.isInteger(r.b) || !Number.isInteger(r.c)
      || r.a < 1 || r.a > 9 || r.b < 1 || r.b > 9 || r.c < 1 || r.c > 81)) {
    msg.textContent = "3つとも、数字を入れてみよう！";
    msg.style.color = "#d86a00";
    return;
  }

  const wrong = rows.findIndex(r => r.a * r.b !== r.c);
  if (wrong !== -1) {
    msg.textContent = `${wrong + 1}ばんめを、もう一ど考えてみよう！`;
    msg.style.color = "#d84b4b";
    return;
  }

  const total = rows.reduce((sum, r) => sum + r.c, 0);
  if (total !== 20) {
    msg.textContent = `合計は ${total} だよ。20になるように、くふうしてみよう！`;
    msg.style.color = "#d84b4b";
    return;
  }

  if (successCount < 3) successCount++;
  setRobot();

  if (successCount === 3) {
    document.getElementById("mission").classList.add("hidden");
    document.getElementById("complete").classList.remove("hidden");
  } else {
    msg.textContent = "せいこう！ ロボットが進化したよ！";
    msg.style.color = "#16884a";
    resetInputs();
  }
}

function resetInputs() {
  document.querySelectorAll("#mission input").forEach(el => el.value = "");
  document.getElementById("a1").focus();
}

function resetMission() {
  resetInputs();
  const msg = document.getElementById("message");
  msg.textContent = "";
}

function resetAll() {
  successCount = 0;
  document.getElementById("mission").classList.remove("hidden");
  document.getElementById("complete").classList.add("hidden");
  resetMission();
  setRobot();
}

setRobot();
</script>
